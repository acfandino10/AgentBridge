name: Bug report
description: Report something that fails or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A small snippet is more useful than a large app. Prefer the mock provider so the report does not depend on a paid API.
      placeholder: |
        1. npm install agent-bridge
        2. Run this snippet
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.0.0"
    validations:
      required: true
